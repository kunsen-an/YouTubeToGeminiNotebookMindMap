<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube to Gemini Notebook</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <section id="not-youtube" class="state state-muted" hidden>
        <h1>動画ページで開いてください</h1>
        <p>YouTube の動画ページを表示してから、もう一度アイコンをクリックしてください。</p>
        <button id="download-debug-button-muted" class="secondary-button" type="button">デバッグ情報を保存</button>
      </section>

      <section id="loading" class="state state-muted">
        <div class="spinner" aria-hidden="true"></div>
        <p>動画情報を確認しています...</p>
      </section>

      <section id="video-panel" hidden>
        <img id="thumbnail" class="thumbnail" alt="">
        <div class="meta">
          <h1 id="title"></h1>
          <p id="channel"></p>
        </div>

        <p id="error" class="message error" hidden></p>
        <ol id="progress" class="progress" aria-live="polite"></ol>

        <button id="add-button" type="button">Gemini Notebookに追加</button>
        <div class="debug-actions">
          <button id="download-debug-button" class="secondary-button" type="button">保存先を選んでデバッグ情報を保存</button>
          <button id="copy-debug-button" class="secondary-button quiet-button" type="button">コピー</button>
        </div>
        <p id="debug-copy-status" class="copy-status" aria-live="polite"></p>
      </section>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
